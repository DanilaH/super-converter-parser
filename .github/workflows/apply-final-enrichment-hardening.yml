name: Apply final enrichment hardening

on:
  push:
    branches: [fix/final-enrichment-hardening]
    paths:
      - .github/workflows/apply-final-enrichment-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/final-enrichment-hardening
      - name: Apply targeted patch
        run: python .github/final-enrichment-hardening.py
      - name: Verify patch scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'src/enrichment/http/fetcher.ts',
              'src/enrichment/http/fetcher.test.ts',
              'src/cli/enrich.ts',
              'src/cli/enrich.input.test.ts',
              'src/enrichment/engine.ts',
              'src/enrichment/engine.test.ts',
          }
          changed = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f'unexpected patch scope: {sorted(paths)}')
          PY
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/enrichment/http/fetcher.ts src/enrichment/http/fetcher.test.ts src/cli/enrich.ts src/cli/enrich.input.test.ts src/enrichment/engine.ts src/enrichment/engine.test.ts
          git rm .github/final-enrichment-hardening.py .github/workflows/apply-final-enrichment-hardening.yml
          git commit -m "fix(enrichment): harden terminal and retry contracts"
          git push origin HEAD:fix/final-enrichment-hardening
