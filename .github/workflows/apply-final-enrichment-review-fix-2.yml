name: Apply second final enrichment review fix

on:
  push:
    branches: [fix/final-enrichment-hardening]
    paths:
      - .github/workflows/apply-final-enrichment-review-fix-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/final-enrichment-hardening
      - name: Apply targeted review fix
        run: python .github/final-enrichment-review-fix-2.py
      - name: Verify review-fix scope
        shell: bash
        run: |
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F "src/cli/enrich.ts"
      - name: Commit review fix and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli/enrich.ts
          git rm .github/final-enrichment-review-fix-2.py .github/workflows/apply-final-enrichment-review-fix-2.yml
          git commit -m "fix(enrichment): validate shortlist before allocation"
          git push origin HEAD:fix/final-enrichment-hardening
