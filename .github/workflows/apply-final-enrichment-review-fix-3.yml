name: Apply third final enrichment review fix

on:
  push:
    branches: [fix/final-enrichment-hardening]
    paths:
      - .github/workflows/apply-final-enrichment-review-fix-3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/final-enrichment-hardening
      - name: Apply targeted review fix
        run: python .github/final-enrichment-review-fix-3.py
      - name: Verify review-fix scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {'README.md', 'src/cli/enrich.ts'}
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in lines}
          if paths != expected:
              raise SystemExit(f'unexpected review-fix scope: {sorted(paths)}')
          PY
      - name: Commit review fix and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md src/cli/enrich.ts
          git rm .github/final-enrichment-review-fix-3.py .github/workflows/apply-final-enrichment-review-fix-3.yml
          git commit -m "docs(enrichment): document required shortlist"
          git push origin HEAD:fix/final-enrichment-hardening
