name: Apply final enrichment review fix

on:
  push:
    branches: [fix/final-enrichment-hardening]
    paths:
      - .github/workflows/apply-final-enrichment-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/final-enrichment-hardening
      - name: Apply targeted review fix
        run: python .github/final-enrichment-review-fix.py
      - name: Verify review-fix scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'src/cli/enrich.ts',
              'src/enrichment/engine.ts',
              'src/enrichment/engine.test.ts',
          }
          changed = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f'unexpected review-fix scope: {sorted(paths)}')
          PY
      - name: Commit review fix and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli/enrich.ts src/enrichment/engine.ts src/enrichment/engine.test.ts
          git rm .github/final-enrichment-review-fix.py .github/workflows/apply-final-enrichment-review-fix.yml
          git commit -m "fix(enrichment): validate persisted deep-module shortlist"
          git push origin HEAD:fix/final-enrichment-hardening
