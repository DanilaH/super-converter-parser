name: Export inspection snapshot

on:
  push:
    branches:
      - inspection/ui-runtime-20260909

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v6
        with:
          name: inspection-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
