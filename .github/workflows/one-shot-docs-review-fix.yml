name: One-shot docs review fix

on:
  push:
    branches: [docs/source-of-truth-cleanup]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/source-of-truth-cleanup
          fetch-depth: 0
      - name: Fix README command-surface wording
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'These examples reflect the implemented CLI. Use `npm run research -- --help` and `npm run enrich -- --help` for the current option surface.'
          new = 'These examples reflect the implemented CLI. The `Implemented CLI` section below is authoritative for research commands; use `npm run enrich -- --help` for enrichment-specific options.'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected README command-surface wording: {text.count(old)} matches')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/one-shot-docs-review-fix.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/one-shot-docs-review-fix.yml
          git diff --cached --check
          git commit -m "docs: avoid unsupported research help flag"
          git push origin HEAD:docs/source-of-truth-cleanup
