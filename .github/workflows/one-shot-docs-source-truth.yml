name: One-shot docs source-of-truth cleanup

on:
  push:
    branches: [docs/source-of-truth-cleanup]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/source-of-truth-cleanup
          fetch-depth: 0

      - name: Apply docs cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected {label} shape: {text.count(old)} matches')
              return text.replace(old, new)

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          text = replace_once(
              text,
              """Read in order:\n\n1. `PRODUCT.md`\n2. `ARCHITECTURE.md`\n3. `PIPELINE.md`\n4. `README.md`\n5. `IMPLEMENTATION_PLAN.md`\n""",
              """Read in order:\n\n1. `PRODUCT.md`\n2. `ARCHITECTURE.md`\n3. `PIPELINE.md`\n4. `README.md`\n5. `ACCEPTANCE.md`\n6. `IMPLEMENTATION_PLAN.md` — historical v1 delivery plan, not the current backlog\n""",
              'AGENTS source-of-truth order',
          )
          text = replace_once(
              text,
              "Do not declare v1 complete until the end-to-end acceptance in `IMPLEMENTATION_PLAN.md` passes.\n",
              "v1 acceptance status is recorded in `ACCEPTANCE.md`. New work must preserve its mandatory PASS contracts and keep that document truthful.\n",
              'AGENTS completion rule',
          )
          text = replace_once(
              text,
              "The phase descriptions below define capability requirements. `IMPLEMENTATION_PLAN.md` defines the current PR delivery order and takes precedence when sequencing differs.\n",
              "The phase descriptions below are a historical capability map. `IMPLEMENTATION_PLAN.md` records the completed v1 delivery sequence; it is not the current backlog. Current behavior and verification contracts come from the code, `README.md`, `PIPELINE.md`, and `ACCEPTANCE.md`.\n",
              'AGENTS implementation-plan status',
          )
          text = replace_once(
              text,
              "The runner connects to a running Chrome over CDP (`CDP_URL`, default `http://127.0.0.1:9222`).\nSurfer must be installed in that Chrome (`hasSurfer` preflight check).\n",
              "The runner connects to a running Chrome over CDP (`CDP_URL`, default `http://127.0.0.1:9333`).\nSurfer must be installed in that dedicated Research Chrome (`hasSurfer` preflight check).\n",
              'AGENTS CDP default',
          )
          pattern = re.compile(r"### Critical: user-data-dir must not contain spaces\n.*?(?=### Known live limitation: related-keywords widget)", re.S)
          replacement = """### Research Chrome setup\n\nUse `npm run chrome:setup` once to prepare the isolated profile and `npm run chrome:start` to launch it. The canonical operator setup and live-acceptance procedure is maintained in `ACCEPTANCE.md` §1; do not duplicate a second machine-specific runbook here.\n\n"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'unexpected AGENTS Research Chrome setup shape: {count} matches')
          pattern = re.compile(r"### CAPTCHA in background runs\n.*\Z", re.S)
          replacement = """### CAPTCHA handling\n\n`pauseForManualCaptcha` polls the Research Chrome page directly. After the operator solves the challenge, the runner continues automatically; no Enter press or marker file is used. Ctrl+C sets the shared cancellation signal so the active keyword remains resumable.\n"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'unexpected AGENTS CAPTCHA flow shape: {count} matches')
          agents.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = replace_once(text, 'Target CLI:\n', 'Primary CLI examples:\n', 'README main-command heading')
          text = replace_once(
              text,
              'npm run research -- --resume <run-id> --refresh-keyword "json diff"\nnpm run research -- --resume <run-id> --refresh-domain example.com\n',
              'npm run research -- --resume <run-id> --refresh-keyword "json diff"\n',
              'README unsupported refresh-domain command',
          )
          text = replace_once(
              text,
              'Exact flag names may be adjusted during implementation if consistency improves, but the capabilities are required.\n',
              'These examples reflect the implemented CLI. Use `npm run research -- --help` and `npm run enrich -- --help` for the current option surface.\n',
              'README implementation-era flag disclaimer',
          )
          readme.write_text(text, encoding='utf-8')

          pipeline = Path('PIPELINE.md')
          text = pipeline.read_text(encoding='utf-8')
          text = replace_once(
              text,
              """```text\n⚠ Google CAPTCHA detected.\n\nRun paused safely.\nSolve the CAPTCHA in Research Chrome.\n\nPress Enter to continue\nor Ctrl+C to save checkpoint and exit.\n```\n\nNo CAPTCHA bypass.\n""",
              """```text\n⚠ Google CAPTCHA detected.\n\nSolve the CAPTCHA in Research Chrome.\nThe runner polls the page and continues automatically after the challenge disappears.\n\nCtrl+C pauses safely and leaves the active keyword resumable.\n```\n\nNo CAPTCHA bypass, Enter prompt, or marker-file handshake.\n""",
              'PIPELINE CAPTCHA UX',
          )
          pipeline.write_text(text, encoding='utf-8')

          plan = Path('IMPLEMENTATION_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          text = replace_once(
              text,
              """## Status\n\nThe browser integration spike is complete and accepted.\n""",
              """## Status\n\n**Historical/completed v1 delivery plan.** PRs 1–8 describe how v1 was built; this file is retained for design history and is not the current backlog. Current operator behavior is documented in `README.md` / `PIPELINE.md`, and reproducible v1 verification lives in `ACCEPTANCE.md`.\n\nThe browser integration spike is complete and accepted.\n""",
              'IMPLEMENTATION_PLAN status',
          )
          plan.write_text(text, encoding='utf-8')

          acceptance = Path('ACCEPTANCE.md')
          text = acceptance.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '| 15 | Typecheck + test suite green | PASS | `npx tsc --noEmit` clean; 299 pass / 0 fail / 1 skipped |',
              '| 15 | Typecheck + test suite green | PASS | CI runs `npm run typecheck` and the complete `npm test` suite; exact test counts are intentionally not pinned here because the suite grows |',
              'ACCEPTANCE stale test count',
          )
          acceptance.write_text(text, encoding='utf-8')

          Path('.github/workflows/one-shot-docs-source-truth.yml').unlink()

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md PIPELINE.md IMPLEMENTATION_PLAN.md ACCEPTANCE.md .github/workflows/one-shot-docs-source-truth.yml
          git diff --cached --check
          git commit -m "docs: align source-of-truth with implemented behavior"
          git push origin HEAD:docs/source-of-truth-cleanup
