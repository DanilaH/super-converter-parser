name: One-shot historical schema review fixes

on:
  push:
    branches: [fix/historical-source-schema]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-source-schema
          fetch-depth: 0
      - name: Apply review fixes
        run: python .github/scripts/historical-source-review-fix.py
      - name: Remove temporary patch machinery
        run: rm .github/scripts/historical-source-review-fix.py .github/workflows/one-shot-historical-review-fix.yml
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/store.ts src/enrichment/engine.test.ts .github/scripts/historical-source-review-fix.py .github/workflows/one-shot-historical-review-fix.yml
          git diff --cached --check
          git commit -m "test(db): cover historical source enrichment path"
          git push origin HEAD:fix/historical-source-schema
