name: One-shot historical source review fix 2

on:
  push:
    branches: [fix/historical-source-schema]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-source-schema
          fetch-depth: 0

      - name: Apply review fix
        run: python .github/apply-historical-review2.py

      - name: Remove temporary patch machinery
        run: rm .github/apply-historical-review2.py .github/workflows/one-shot-historical-review2.yml

      - name: Commit review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/store.ts src/db/store.test.ts README.md .github/apply-historical-review2.py .github/workflows/one-shot-historical-review2.yml
          git diff --cached --check
          git commit -m "fix(db): handle pre-v5 related keyword provenance"
          git push origin HEAD:fix/historical-source-schema
