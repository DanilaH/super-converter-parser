name: One-shot migration review fix

on:
  push:
    branches: [fix/migration-repair-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/migration-repair-hardening
          fetch-depth: 0

      - name: Apply migration review fix
        run: python .github/apply-migration-review-fix.py

      - name: Remove temporary patch machinery
        run: rm .github/apply-migration-review-fix.py .github/workflows/one-shot-migration-review-fix.yml

      - name: Commit migration review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/store.ts src/db/store.test.ts .github/apply-migration-review-fix.py .github/workflows/one-shot-migration-review-fix.yml
          git diff --cached --check
          git commit -m "fix(db): report persisted migration version on failure"
          git push origin HEAD:fix/migration-repair-hardening
