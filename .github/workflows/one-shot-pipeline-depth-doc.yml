name: One-shot pipeline depth doc

on:
  push:
    branches: [fix/config-truthfulness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/config-truthfulness
          fetch-depth: 0

      - name: Align pipeline depth contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('PIPELINE.md')
          text = path.read_text(encoding='utf-8')
          old = "- maximum expansion depth.\n\nv1 default depth must be `1`."
          new = "- expansion depth (v1 supports only depth `1`; deeper recursion is not implemented).\n\nv1 depth is fixed at `1`."
          if text.count(old) != 1:
              raise SystemExit('unexpected pipeline depth contract shape')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/one-shot-pipeline-depth-doc.yml').unlink()

      - name: Commit review fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PIPELINE.md .github/workflows/one-shot-pipeline-depth-doc.yml
          git diff --cached --check
          git commit -m "docs(pipeline): state depth-one expansion contract"
          git push origin HEAD:fix/config-truthfulness
