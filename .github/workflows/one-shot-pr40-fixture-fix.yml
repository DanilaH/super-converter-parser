name: One-shot PR 40 fixture fix

on:
  push:
    branches: [perf/test-suite-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/test-suite-runtime
          fetch-depth: 0

      - name: Restore valid query-suggestions parent fixture
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/enrichment/querySuggestions.test.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index("test('autocomplete HTTP 429/500 does not become empty via real HTTP path'")
          end = text.index("\ntest('primitive/null occurrence element fails with DB_ERROR'", start)
          block = text[start:end]
          if block.count("shortlistKeywords: ['json diff'],") != 1 or block.count("shortlist: ['json diff'],") != 1:
              raise SystemExit('unexpected HTTP-error fixture shape')
          block = block.replace("shortlistKeywords: ['json diff'],", 'shortlistKeywords: testShortlist(),')
          block = block.replace("shortlist: ['json diff'],", 'shortlist: testShortlist(),')
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')

          Path('.github/workflows/one-shot-pr40-fixture-fix.yml').unlink()

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enrichment/querySuggestions.test.ts .github/workflows/one-shot-pr40-fixture-fix.yml
          git diff --cached --check
          git commit -m "test: restore valid query-suggestions fixture"
          git push origin HEAD:perf/test-suite-runtime
