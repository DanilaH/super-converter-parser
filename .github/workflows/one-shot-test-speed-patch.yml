name: One-shot test speed patch

on:
  push:
    branches: [perf/test-suite-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/test-suite-runtime
          fetch-depth: 0

      - name: Apply test speed patch
        shell: python
        run: |
          from pathlib import Path

          qs = Path('src/enrichment/querySuggestions.test.ts')
          text = qs.read_text(encoding='utf-8')
          old_import = "  defaultQuerySuggestionsConfig,\n"
          new_import = "  defaultQuerySuggestionsConfig as productionDefaultQuerySuggestionsConfig,\n"
          if text.count(old_import) != 1:
              raise SystemExit(f'expected one querySuggestions import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          anchor = "import type { QuerySuggestionSource } from './types.js';\n\n"
          helper = (
              "// These tests exercise source, cache, persistence, and retry semantics, not\n"
              "// production wall-clock pacing between parent keywords.\n"
              "function defaultQuerySuggestionsConfig(): ReturnType<typeof productionDefaultQuerySuggestionsConfig> {\n"
              "  return {\n"
              "    ...productionDefaultQuerySuggestionsConfig(),\n"
              "    rateLimitMinDelayMs: 0,\n"
              "    rateLimitMaxDelayMs: 0,\n"
              "  };\n"
              "}\n\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one querySuggestions anchor, found {text.count(anchor)}')
          text = text.replace(anchor, anchor + helper)
          qs.write_text(text, encoding='utf-8')

          fetcher = Path('src/enrichment/http/fetcher.test.ts')
          text = fetcher.read_text(encoding='utf-8')
          old = "const testConfig = { minDomainDelayMs: 0, maxDomainDelayMs: 0, ssrfChecker: allowAllSsrf };"
          new = "const testConfig = { minDomainDelayMs: 0, maxDomainDelayMs: 0, maxRetries: 0, ssrfChecker: allowAllSsrf };"
          if text.count(old) != 1:
              raise SystemExit(f'expected one fetcher testConfig, found {text.count(old)}')
          fetcher.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/one-shot-test-speed-patch.yml').unlink()

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enrichment/querySuggestions.test.ts src/enrichment/http/fetcher.test.ts .github/workflows/one-shot-test-speed-patch.yml
          git diff --cached --check
          git commit -m "perf(tests): remove production pacing from unit tests"
          git push origin HEAD:perf/test-suite-runtime
