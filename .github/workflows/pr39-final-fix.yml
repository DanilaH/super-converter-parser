name: PR 39 final fix

on:
  push:
    branches:
      - fix/psl-domain-normalization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/psl-domain-normalization
          fetch-depth: 0

      - name: Apply reviewed test fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/cache/store.test.ts',
              "googleParserVersion: '1.2.0',\n  });\n});",
              "googleParserVersion: '1.3.0',\n  });\n});",
          )

          replace_once(
              'src/cli/research.captcha.test.ts',
              "    const t1 = setTimeout(() => process.emit('SIGINT'), 400);\n    const t2 = setTimeout(() => process.emit('SIGINT'), 600);\n    const code = await run;\n    clearTimeout(t1);\n    clearTimeout(t2);",
              "    const signalTimer = setTimeout(() => {\n      // Deliver both signals in one callback so the assertion does not depend\n      // on how quickly the first graceful pause unwinds the async collector.\n      process.emit('SIGINT');\n      process.emit('SIGINT');\n    }, 400);\n    const code = await run;\n    clearTimeout(signalTimer);",
          )
          PY

      - name: Commit fixes and remove helper
        shell: bash
        run: |
          git rm .github/workflows/pr39-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: fix final CI regressions"
          git push origin HEAD:fix/psl-domain-normalization
