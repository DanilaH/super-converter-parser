name: V2.2 baseline typecheck repair

on:
  push:
    branches: [v2.2/baseline-typecheck-fix]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v2.2/baseline-typecheck-fix
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node tools/v2-2-baseline-typecheck-fixup.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified repairs and remove temporary machinery
        shell: bash
        run: |
          git rm tools/v2-2-baseline-typecheck-fixup.mjs .github/workflows/v2-2-baseline-typecheck-fix.yml
          git add src/cli/cohortHistory.test.ts src/cli/entrantCohort.test.ts src/cli/representatives.test.ts src/cli/trafficEvidence.test.ts src/enrichment/clusteringSnapshot.test.ts src/enrichment/cohortHistory.test.ts src/runs/serpEvidence.test.ts src/scoring/scoring.serpTruth.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(v2.2): restore strict baseline typecheck"
          git push origin HEAD:v2.2/baseline-typecheck-fix
