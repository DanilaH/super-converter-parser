name: V2.2 historical source live benchmark

on:
  push:
    branches: [v2.2/pr-01-history-spike-live]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run decision-sized annual benchmark
        run: npm run spike:history -- --output data/spikes/live-decision --collection-mode annual --max-collections 48 --request-budget 2500
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-2-history-live-decision
          path: data/spikes/live-decision
          if-no-files-found: warn
          retention-days: 7
