name: V2.2 PR-04 coverage implementation

on:
  push:
    branches:
      - v2.2/pr-04-coverage-runner

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.head_commit.message == 'chore(v2.2): run PR-04 coverage implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v2.2/pr-04-coverage-runner
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply integration patch
        run: python scripts/v2_2_pr04_patch.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: node --import tsx --test src/research/evidenceCoverage.test.ts src/research/status.test.ts src/enrichment/finalistEvidence.test.ts src/enrichment/trafficEvidenceCurrent.test.ts
      - name: Full suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit verified product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/research/evidenceCoverage.ts src/research/evidenceCoverage.test.ts src/research/status.ts src/cli/researchStatus.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(v2.2): surface deep evidence coverage warnings"
          git push origin HEAD:v2.2/pr-04-coverage-runner
