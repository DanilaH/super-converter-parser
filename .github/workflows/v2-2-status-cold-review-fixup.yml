name: V2.2 research status cold-review fixup

on:
  push:
    branches: [v2.2/pr-03-research-status]

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply cold-review fixes
        run: node tools/v2-2-status-cold-review-fixup.mjs
      - run: npm ci
      - run: npm run typecheck
      - name: Run focused status tests
        run: node --import tsx --test src/research/status.test.ts
      - name: Commit verified fixes and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/status.ts src/research/status.test.ts src/cli/researchStatus.ts
          git commit -m "fix(v2.2): harden research status truth semantics"
          git rm .github/workflows/v2-2-status-cold-review-fixup.yml tools/v2-2-status-cold-review-fixup.mjs
          git commit -m "chore(v2.2): remove status fixup machinery"
          git push origin HEAD:v2.2/pr-03-research-status
