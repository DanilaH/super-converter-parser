name: V2.2 research status Library fingerprint fixup

on:
  push:
    branches: [v2.2/pr-03-research-status]

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply exact Library snapshot fix
        run: node tools/v2-2-status-library-fingerprint-fixup.mjs
      - run: npm ci
      - run: npm run typecheck
      - name: Run focused status and Library tests
        run: node --import tsx --test src/research/status.test.ts src/library/researchLibrary.test.ts
      - name: Commit verified fixes and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/library/researchLibrary.ts src/research/status.ts src/research/status.test.ts
          git commit -m "fix(v2.2): verify exact Library snapshot in research status"
          git rm .github/workflows/v2-2-status-library-fingerprint-fixup.yml tools/v2-2-status-library-fingerprint-fixup.mjs
          git commit -m "chore(v2.2): remove Library fingerprint fixup machinery"
          git push origin HEAD:v2.2/pr-03-research-status
