<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runner Console</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/metadata.css">
  <link rel="stylesheet" href="/batches.css">
  <link rel="stylesheet" href="/repair.css">
  <link rel="stylesheet" href="/shortlist.css">
  <link rel="stylesheet" href="/finalists.css">
  <link rel="stylesheet" href="/decisions.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar workspace-rail">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div>
          <strong>Runner</strong>
          <span>Research workspace</span>
        </div>
      </div>

      <div id="research-chrome-root" class="workspace-chrome" aria-live="polite"></div>

      <a id="workspace-new" class="button primary link-button workspace-primary" href="#/new">+ New research</a>

      <div class="workspace-search-wrap">
        <input id="workspace-search" class="search workspace-search" type="search" placeholder="Search researches…" aria-label="Search researches">
      </div>
      <div class="workspace-list-label">
        <span>Researches</span>
        <span>open on right</span>
      </div>
      <div id="workspace-researches" class="workspace-researches" aria-live="polite"></div>

      <div class="workspace-footer">
        <div class="workspace-footer-row">
          <div id="workspace-job-status" class="workspace-job-line" aria-live="polite"></div>
          <button id="workspace-system" class="button compact" type="button">System</button>
        </div>
        <div class="sidebar-footer">
          <span class="status-dot"></span>
          localhost only
        </div>
      </div>
    </aside>

    <main class="main workspace-main">
      <div id="repair-action-root" class="repair-action-shell repair-action hidden" aria-live="polite"></div>
      <div id="shortlist-action-root" class="shortlist-action-shell hidden" aria-live="polite"></div>
      <div id="finalist-action-root" class="finalist-action-shell hidden" aria-live="polite"></div>
      <div id="decision-action-root" class="decision-action-shell hidden" aria-live="polite"></div>
      <div id="app" class="page" aria-live="polite"></div>
      <div id="metadata-action-root" class="metadata-action-shell hidden" aria-live="polite"></div>
      <div id="batch-action-root" class="batch-action-shell hidden" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="/workspace.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/research-chrome.js"></script>
  <script type="module" src="/seed-import.js"></script>
  <script type="module" src="/metadata.js"></script>
  <script type="module" src="/batches.js"></script>
  <script type="module" src="/repair.js"></script>
  <script type="module" src="/shortlist.js"></script>
  <script type="module" src="/finalists.js"></script>
  <script type="module" src="/decisions.js"></script>
</body>
</html>
