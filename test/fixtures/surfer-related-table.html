<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Surfer related table fixture</title>
</head>
<body>
  <!-- Mirrors the real Keyword Surfer sidebar DOM: the related-keywords table
       lives inside the MAIN Google document, inside the element whose class is
       keyword-surfer-sidebar (NOT inside an iframe). -->
  <div class="keyword-surfer keyword-surfer-sidebar">
    <div class="keyword-surfer-sidebar-header">Keyword ideas</div>
    <table class="keyword-surfer-related-table">
      <thead>
        <tr>
          <th>Keyword</th>
          <th>Overlap</th>
          <th>Volume</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="checkbox" /></td>
          <td><a href="https://www.instagram.com/">instagram</a></td>
          <td><span class="overlap">50%</span></td>
          <td><span class="volume">30,400,000</span></td>
        </tr>
        <tr>
          <td><input type="checkbox" /></td>
          <td><a href="#">ig app</a></td>
          <td><span class="overlap">28%</span></td>
          <td><span class="volume">135,000</span></td>
        </tr>
        <tr>
          <td><input type="checkbox" /></td>
          <td><a href="#">the instagram app</a></td>
          <td><span class="overlap">30%</span></td>
          <td><span class="volume">90,500</span></td>
        </tr>
        <tr>
          <td><input type="checkbox" /></td>
          <td><a href="#">list comparison</a></td>
          <td><span class="overlap">100%</span></td>
          <td><span class="volume">49,500</span></td>
        </tr>
        <tr>
          <td><input type="checkbox" /></td>
          <td><a href="#">compare list</a></td>
          <td><span class="overlap">100%</span></td>
          <td><span class="volume">40,500</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
